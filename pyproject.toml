[project]
name = "alphareport"
version = "0.1.0"
description = "Quant research report collection, classification, analysis, and daily email push agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AlphaReport Contributors" }
]
dependencies = [
  # Web 框架
  "fastapi>=0.104",
  "uvicorn[standard]>=0.24",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  # Agent + LLM
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  # PDF 处理
  "pymupdf>=1.24",
  # 数据源
  "arxiv>=2.1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  # 向量检索
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  # 定时任务
  "apscheduler>=3.10",
  # 配置
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
alphareport-api = "reportagent.main:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reportagent"]

[tool.uv]
package = true
